<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ERP Mentoring System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="layers" style="color:var(--primary);"></i>
                <span>EduERP</span>
            </div>
            <nav id="sidebar-nav"></nav>
            <div style="margin-top:auto;">
                <a href="#" class="nav-item" onclick="logout()">
                    <i data-lucide="log-out"></i><span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h2 id="page-title">Dashboard</h2>
                <div class="user-profile">
                    <div id="notification-bell" style="position:relative;cursor:pointer;padding:0.5rem;" onclick="toggleNotifPanel()">
                        <i data-lucide="bell"></i>
                        <span id="notif-count" style="position:absolute;top:0;right:0;background:var(--danger);font-size:10px;border-radius:50%;padding:2px 5px;display:none;">0</span>
                    </div>
                    <div>
                        <p id="user-name" style="font-weight:600;font-size:0.9rem;"></p>
                        <p id="user-role" style="font-size:0.7rem;color:var(--text-muted);"></p>
                    </div>
                    <div style="width:38px;height:38px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;" id="user-avatar"></div>
                </div>
            </header>
            <div id="dashboard-content"><div style="text-align:center;padding:3rem;color:var(--text-muted);">Loading...</div></div>
        </main>
    </div>

    <!-- Notification Panel -->
    <div id="notif-panel" style="display:none;position:fixed;top:70px;right:1.5rem;width:320px;background:var(--bg-card);border:1px solid var(--border);border-radius:1rem;z-index:999;box-shadow:0 20px 40px rgba(0,0,0,0.5);max-height:500px;overflow-y:auto;">
        <div style="padding:1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <h3 style="font-size:1rem;">Notifications</h3>
            <button onclick="markAllRead()" style="background:none;border:none;color:var(--primary);font-size:0.8rem;cursor:pointer;">Mark all read</button>
        </div>
        <div id="notif-list" style="padding:0.5rem;"></div>
    </div>

    <!-- Scripts: Core first, then role pages -->
    <script src="js/main.js?v=1.2"></script>
    <script src="js/dashboard.js?v=1.2"></script>
    <script src="js/admin.js?v=1.2"></script>
    <script src="js/admin_pages.js?v=1.2"></script>
    <script src="js/mentor.js?v=1.2"></script>
    <script src="js/mentor_pages.js?v=1.2"></script>
    <script src="js/student.js?v=1.2"></script>
    <script src="js/student_pages.js?v=1.2"></script>
    <script src="js/hod.js?v=1.2"></script>
    <script src="js/hod_pages.js?v=1.2"></script>
    <script src="js/principal.js?v=1.2"></script>
    <script src="js/principal_pages.js?v=1.2"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
